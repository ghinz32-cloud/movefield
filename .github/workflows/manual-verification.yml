name: Manual source verification
# Owner dispatch only: no billed builds or deployment triggers on source pushes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --prod=false
      - run: npm ci --cache ../.sites-runtime/npm-cache
        working-directory: mobile
      - run: pnpm verify:core
      - run: pnpm build
      - run: node scripts/check-production-security.cjs
      - run: npm run export:mobile -- --max-workers 2
        working-directory: mobile
        env:
          EXPO_OFFLINE: '1'
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
  dependency-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm audit --prod --audit-level high
      - run: npm ci --cache ../.sites-runtime/npm-cache
        working-directory: mobile
      # Known native advisories remain a failing release gate; never suppress them.
      - run: npm audit --omit=dev --audit-level high --cache ../.sites-runtime/npm-cache
        working-directory: mobile
